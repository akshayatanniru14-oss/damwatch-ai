version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./backend/app:/app/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMMA_MODEL=${GEMMA_MODEL}
    depends_on:
      - db

  db:
    image: nouchka/sqlite3
    volumes:
      - ./backend/app/db:/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://backend:8000/api

networks:
  default:
    driver: bridge